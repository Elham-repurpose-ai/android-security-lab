<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSafe AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb7cc;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #303a55;
      background: #151c30;
      color: white;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 14px;
      background: #151c30;
      border: 1px solid #303a55;
      display: none;
    }

    .risk {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .section {
      margin-top: 15px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    ul {
      margin-top: 5px;
      padding-left: 20px;
    }

    .error {
      color: #ff8f8f;
    }

    .small {
      color: #8f9ab3;
      font-size: 13px;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>CyberSafe AI</h1>

    <div class="subtitle">
      AI-powered phishing and scam awareness assistant
    </div>

    <textarea
      id="message"
      placeholder="Paste a suspicious message, email, or URL here..."
    ></textarea>

    <button id="analyzeBtn">
      Analyze with AI
    </button>

    <div id="result" class="result"></div>

    <div class="small">
      AI analysis is an assessment and does not guarantee that content is safe or malicious.
    </div>

  </div>

  <script>
    const messageInput = document.getElementById("message");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const resultBox = document.getElementById("result");

    analyzeBtn.addEventListener("click", analyzeMessage);

    async function analyzeMessage() {

      const text = messageInput.value.trim();

      if (!text) {
        showError("Please enter a message or URL first.");
        return;
      }

      analyzeBtn.disabled = true;
      analyzeBtn.textContent = "Analyzing...";

      resultBox.style.display = "block";
      resultBox.innerHTML = "CyberSafe AI is analyzing the content...";

      try {

        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            text: text
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "AI request failed.");
        }

        displayAIResult(data.result);

      } catch (error) {

        showError(
          "Could not connect to CyberSafe AI.<br><br>" +
          escapeHTML(error.message)
        );

      } finally {

        analyzeBtn.disabled = false;
        analyzeBtn.textContent = "Analyze with AI";

      }
    }


    function displayAIResult(rawResult) {

      let parsed;

      try {

        parsed = JSON.parse(rawResult);

      } catch {

        const jsonMatch = rawResult.match(/\{[\s\S]*\}/);

        if (jsonMatch) {

          try {
            parsed = JSON.parse(jsonMatch[0]);
          } catch {
            parsed = null;
          }

        }

      }


      if (!parsed) {

        resultBox.innerHTML = `
          <div class="risk">AI Analysis</div>

          <div class="section">
            ${formatText(rawResult)}
          </div>
        `;

        return;
      }


      const risk = String(parsed.risk || "UNKNOWN").toUpperCase();

      const score = parsed.score !== undefined
        ? escapeHTML(String(parsed.score))
        : "N/A";

      const indicators = Array.isArray(parsed.indicators)
        ? parsed.indicators
        : [];

      const advice = Array.isArray(parsed.advice)
        ? parsed.advice
        : parsed.advice
          ? [parsed.advice]
          : [];


      let indicatorsHTML = "";

      if (indicators.length > 0) {

        indicatorsHTML = `
          <div class="section">
            <div class="section-title">Why</div>
            <ul>
              ${indicators
                .map(item => `<li>${escapeHTML(String(item))}</li>`)
                .join("")}
            </ul>
          </div>
        `;

      }


      let adviceHTML = "";

      if (advice.length > 0) {

        adviceHTML = `
          <div class="section">
            <div class="section-title">Recommended action</div>
            <ul>
              ${advice
                .map(item => `<li>${escapeHTML(String(item))}</li>`)
                .join("")}
            </ul>
          </div>
        `;

      }


      resultBox.innerHTML = `
        <div class="risk">
          ${escapeHTML(risk)} RISK — ${score}/10
        </div>

        ${indicatorsHTML}

        ${adviceHTML}
      `;
    }


    function showError(message) {

      resultBox.style.display = "block";

      resultBox.innerHTML = `
        <div class="risk error">Error</div>
        <div>${message}</div>
      `;

    }


    function formatText(text) {

      return escapeHTML(String(text))
        .replace(/\n/g, "<br>");

    }


    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
