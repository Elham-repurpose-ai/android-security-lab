<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CyberSafe AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 18px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #334155;
    }

    .risk {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .high {
      color: #ef4444;
    }

    .medium {
      color: #fbbf24;
    }

    .low {
      color: #4ade80;
    }

    .item {
      margin: 10px 0;
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>CyberSafe AI</h1>

    <p class="subtitle">
      Security awareness assistant for suspicious messages and links.
    </p>

    <textarea
      id="input"
      placeholder="Paste a suspicious message, email, or URL here..."></textarea>

    <button onclick="analyze()">
      Analyze
    </button>

    <div id="result" class="result"></div>

    <footer>
      CyberSafe AI — Security Awareness Tool
    </footer>

  </div>

  <script>

    function analyze() {

      const input = document.getElementById("input").value.trim();
      const result = document.getElementById("result");

      if (!input) {
        result.style.display = "block";

        result.innerHTML = `
          <div class="risk medium">
            No input
          </div>

          <div class="item">
            Enter a message, email, or URL to analyze.
          </div>
        `;

        return;
      }

      const lowerInput = input.toLowerCase();

      let score = 0;
      let warnings = [];

      /* Suspicious language */

      const warningPatterns = [

        {
          text: "urgent",
          points: 2,
          reason: "Creates pressure to act quickly."
        },

        {
          text: "verify your account",
          points: 2,
          reason: "Requests account verification."
        },

        {
          text: "click",
          points: 2,
          reason: "Encourages clicking a link."
        },

        {
          text: "password",
          points: 3,
          reason: "Mentions sensitive authentication information."
        },

        {
          text: "verification code",
          points: 3,
          reason: "May involve a sensitive security code."
        },

        {
          text: "recovery phrase",
          points: 4,
          reason: "Recovery phrases are highly sensitive."
        },

        {
          text: "winner",
          points: 2,
          reason: "Prize-related language can be used in scams."
        },

        {
          text: "prize",
          points: 2,
          reason: "Prize-related language can be used in scams."
        },

        {
          text: "free",
          points: 1,
          reason: "Free offers can sometimes be used to attract victims."
        },

        {
          text: "gift",
          points: 1,
          reason: "Gift-related offers can sometimes be used in scams."
        },

        {
          text: "confirm your account",
          points: 2,
          reason: "Requests account confirmation."
        },

        {
          text: "login",
          points: 2,
          reason: "Login-related language can be used in credential scams."
        }

      ];

      warningPatterns.forEach(function(pattern) {

        if (lowerInput.includes(pattern.text)) {

          score += pattern.points;

          warnings.push({
            text: pattern.text,
            reason: pattern.reason
          });

        }

      });


      /* URL detection */

      const urlPattern = /https?:\/\/[^\s]+/gi;
      const urls = input.match(urlPattern);

      if (urls) {

        urls.forEach(function(url) {

          score += 1;

          warnings.push({
            text: "URL detected",
            reason: "A link was found. Verify the domain before opening it."
          });

          try {

            const cleanUrl = url.replace(/[.,!?;:)\]}]+$/g, "");
            const link = new URL(cleanUrl);

            const hostname = link.hostname.toLowerCase();

            if (link.protocol !== "https:") {

              score += 2;

              warnings.push({
                text: "Insecure connection",
                reason: "The link does not use HTTPS."
              });

            }

            if (hostname.includes("@")) {

              score += 2;

              warnings.push({
                text: "Suspicious URL structure",
                reason: "The URL contains an unusual structure that should be verified."
              });

            }

            if (hostname.includes("-")) {

              score += 1;

              warnings.push({
                text: "Unusual domain structure",
                reason: "The domain contains a hyphen. Verify that it belongs to the expected organization."
              });

            }

          } catch (error) {

            warnings.push({
              text: "URL format warning",
              reason: "The detected link could not be fully analyzed."
            });

          }

        });

      }


      /* Risk calculation */

      let riskLevel;
      let riskClass;

      if (score >= 6) {

        riskLevel = "HIGH RISK";
        riskClass = "high";

      } else if (score >= 3) {

        riskLevel = "MEDIUM RISK";
        riskClass = "medium";

      } else {

        riskLevel = "LOW RISK";
        riskClass = "low";

      }


      /* Display result */

      result.style.display = "block";

      let warningHTML = "";

      if (warnings.length > 0) {

        warnings.forEach(function(warning) {

          warningHTML += `
            <div class="item">
              <strong>${warning.text}</strong><br>
              ${warning.reason}
            </div>
          `;

        });

      } else {

        warningHTML = `
          <div class="item">
            No obvious warning patterns were detected.
          </div>
        `;

      }


      result.innerHTML = `

        <div class="risk ${riskClass}">
          ${riskLevel}
        </div>

        <div class="item">
          Risk score: <strong>${score}</strong>
        </div>

        ${warningHTML}

        <div class="item">
          <strong>Safety advice:</strong><br>
          Do not provide passwords, verification codes,
          recovery phrases, or financial information to
          an unverified source.
        </div>

        <div class="item">
          This is an automated security-awareness assessment.
          A risk score does not prove that a message is malicious
          or safe.
        </div>

      `;

    }

  </script>

</body>
</html>
