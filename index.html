<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Android Security Lab</title>
</head>

<body>
  <h1>Android Security Lab</h1>

  <p>Permission-awareness demonstration.</p>

  <button onclick="requestCamera()">Test Camera Permission</button>

  <p id="result"></p>

  <script>
    async function requestCamera() {
      const result = document.getElementById("result");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true
        });

        result.textContent =
          "Camera permission was granted. No photo or video was recorded.";

        stream.getTracks().forEach(track => track.stop());

      } catch (error) {
        result.textContent =
          "Camera permission was denied or unavailable.";
      }
    }
  </script>
</body>
</html>
