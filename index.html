<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CyberSafe AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb7cc;
      margin-bottom: 25px;
    }

    .modes {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mode {
      flex: 1;
      padding: 12px;
      border: 1px solid #303a55;
      border-radius: 10px;
      background: #151c30;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 15px;
    }

    .mode.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #303a55;
      background: #151c30;
      color: white;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    button.analyze {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button.analyze:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 14px;
      background: #151c30;
      border: 1px solid #303a55;
      display: none;
    }

    .risk {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .section {
      margin-top: 15px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    ul {
      margin-top: 5px;
      padding-left: 20px;
    }

    .error {
      color: #ff8f8f;
    }

    .small {
      color: #8f9ab3;
      font-size: 13px;
      margin-top: 20px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>CyberSafe AI</h1>

    <div class="subtitle">
      AI-powered phishing and scam awareness assistant
    </div>

    <div class="modes">
      <button class="mode active" id="messageMode">
        Message
      </button>

      <button class="mode" id="urlMode">
        URL
      </button>
    </div>

    <textarea
      id="inputText"
      placeholder="Paste a suspicious message, email, or text here..."
    ></textarea>

    <button class="analyze" id="analyzeBtn">
      Analyze with AI
    </button>

    <div id="result" class="result"></div>

    <div class="small">
      CyberSafe AI provides security-awareness analysis.
      Do not enter real passwords, verification codes, recovery phrases,
      or other secrets.
    </div>

  </div>

  <script>
    const inputText = document.getElementById("inputText");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const resultBox = document.getElementById("result");

    const messageMode = document.getElementById("messageMode");
    const urlMode = document.getElementById("urlMode");

    let currentMode = "message";


    messageMode.addEventListener("click", () => {

      currentMode = "message";

      messageMode.classList.add("active");
      urlMode.classList.remove("active");

      inputText.placeholder =
        "Paste a suspicious message, email, or text here...";

      inputText.value = "";
      resultBox.style.display = "none";

    });


    urlMode.addEventListener("click", () => {

      currentMode = "url";

      urlMode.classList.add("active");
      messageMode.classList.remove("active");

      inputText.placeholder =
        "Paste a suspicious URL here...";

      inputText.value = "";
      resultBox.style.display = "none";

    });


    analyzeBtn.addEventListener("click", analyze);


    async function analyze() {

      const text = inputText.value.trim();

      if (!text) {
        showError(
          currentMode === "url"
            ? "Please enter a URL first."
            : "Please enter a message first."
        );

        return;
      }


      if (currentMode === "url") {

        if (!isValidURL(text)) {

          showError(
            "Please enter a complete URL beginning with http:// or https://"
          );

          return;
        }

      }


      analyzeBtn.disabled = true;
      analyzeBtn.textContent = "Analyzing...";

      resultBox.style.display = "block";

      resultBox.innerHTML =
        "CyberSafe AI is analyzing the content...";


      try {

        const response = await fetch("/api/analyze", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            text:
              currentMode === "url"
                ? "Analyze this URL for phishing, scam, credential theft, suspicious domain structure, redirects, and other security indicators. URL: " + text
                : text

          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "AI request failed."
          );

        }


        displayResult(data.result);


      } catch (error) {

        showError(
          "Could not connect to CyberSafe AI.<br><br>" +
          escapeHTML(error.message)
        );

      } finally {

        analyzeBtn.disabled = false;
        analyzeBtn.textContent = "Analyze with AI";

      }

    }


    function isValidURL(value) {

      try {

        const url = new URL(value);

        return (
          url.protocol === "http:" ||
          url.protocol === "https:"
        );

      } catch {

        return false;

      }

    }

function displayResult(rawResult, technicalFindings = []) {

  let parsed = null;

  try {
    parsed = JSON.parse(rawResult);
  } catch {
    const match =
      String(rawResult).match(/\{[\s\S]*\}/);

    if (match) {
      try {
        parsed = JSON.parse(match[0]);
      } catch {
        parsed = null;
      }
    }
  }

  let aiHTML = "";

  if (!parsed) {

    aiHTML = `
      <div class="risk">
        AI Analysis
      </div>

      <div class="section">
        ${formatText(rawResult)}
      </div>
    `;

  } else {

    const risk =
      String(parsed.risk || "UNKNOWN").toUpperCase();

    const score =
      parsed.score !== undefined
        ? escapeHTML(String(parsed.score))
        : "N/A";

    const indicators =
      Array.isArray(parsed.indicators)
        ? parsed.indicators
        : [];

    const advice =
      Array.isArray(parsed.advice)
        ? parsed.advice
        : parsed.advice
          ? [parsed.advice]
          : [];

    let indicatorsHTML = "";

    if (indicators.length > 0) {

      indicatorsHTML = `
        <div class="section">

          <div class="section-title">
            Why
          </div>

          <ul>
            ${indicators
              .map(item =>
                `<li>${escapeHTML(String(item))}</li>`
              )
              .join("")}
          </ul>

        </div>
      `;
    }

    let adviceHTML = "";

    if (advice.length > 0) {

      adviceHTML = `
        <div class="section">

          <div class="section-title">
            Recommended action
          </div>

          <ul>
            ${advice
              .map(item =>
                `<li>${escapeHTML(String(item))}</li>`
              )
              .join("")}
          </ul>

        </div>
      `;
    }

    aiHTML = `
      <div class="risk">
        ${escapeHTML(risk)} RISK — ${score}/10
      </div>

      ${indicatorsHTML}

      ${adviceHTML}
    `;
  }

  let technicalHTML = "";

  if (technicalFindings.length > 0) {

    technicalHTML = `
      <div class="section">

        <div class="section-title">
          Technical URL Inspection
        </div>

        <ul>
          ${technicalFindings
            .map(item =>
              `<li>${escapeHTML(String(item))}</li>`
            )
            .join("")}
        </ul>

      </div>
    `;
  }

  resultBox.innerHTML = `
    ${technicalHTML}

    ${aiHTML}
  `;
}
    

            

    function showError(message) {

      resultBox.style.display = "block";

      resultBox.innerHTML = `

        <div class="risk error">
          Error
        </div>

        <div>
          ${message}
        </div>

      `;

    }


    function formatText(text) {

      return escapeHTML(String(text))
        .replace(/\n/g, "<br>");

    }


    function escapeHTML(value) {

      return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
